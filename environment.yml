name: quantum_pulse_cal
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # 科学计算
  - numpy
  - scipy
  - matplotlib
  - jupyter
  - ipykernel

  # PyTorch
  - pytorch
  - torchvision

  # 数据处理
  - pandas

  - pip:
    # Qiskit
    - qiskit
    - qiskit-dynamics        # 脉冲模拟和校准核心库
    - qiskit-ibm-runtime     # 连接 IBM 量子硬件

    # 可视化
    - plotly

    # 实验管理
    - tqdm
